[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disc-printer"
version = "0.2.0"
description = "CD/DVD Disc Label Printer (GTK4 + CUPS)"
requires-python = ">=3.11"
# PyGObject, pycairo und CUPS-Bindings müssen per Paketmanager installiert werden:
#   sudo pacman -S python-gobject python-cairo
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
enhanced = [
    "Pillow>=10.0",
]

[project.scripts]
disc-printer = "disc_printer.gui.window:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disc_printer"]
# .mo-Dateien (kompilierte Übersetzungen) werden ins Wheel eingebettet
artifacts = ["src/disc_printer/locale/**/*.mo"]

[tool.hatch.build.targets.sdist]
include = ["src/", "Makefile", "hatch_build.py"]

# Custom build hook: compile .po -> .mo at build time (see hatch_build.py).
# Runs for both wheel and sdist targets so translations are present either way.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.envs.default]
features = ["enhanced"]
